version: '3.8'

services:
  # 1. PostgreSQL 16 with PostGIS extension for spatial queries
  postgis:
    image: postgis/postgis:16-3.4
    container_name: civicai-postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: civicai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init_postgis.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend & AI Services (YOLO + PostGIS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicai-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgis:5432/civicai
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped

  # 3. React Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicai-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
